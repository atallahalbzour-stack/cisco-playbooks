---
- name: Create New VLAN 10 on All Switches
  hosts: all
  gather_facts: no
  connection: network_cli

  tasks:
    - name: Create VLAN 10
      cisco.ios.ios_vlan:
        vlan_id:70
        name: Data_Network
        state: present

    - name: Save configuration
      cisco.ios.ios_config:
        save_when: always

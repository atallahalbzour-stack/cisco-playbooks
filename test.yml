---
- name: Create VLAN 70 on Cisco Switches
  hosts: all
  gather_facts: no
  connection: network_cli
  vars:
    ansible_network_os: ios

  tasks:
    - name: Create VLAN 70 and save config
      ios_command:
        commands:
          - configure terminal
          - vlan 70
          - name Data_Network
          - end
          - write memory

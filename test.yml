---
- name: Create VLAN 70 on Cisco Switches
  hosts: all
  gather_facts: no
  connection: network_cli
  vars:
    ansible_network_os: ios
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o KexAlgorithms=+diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group2-sha1 -o Ciphers=+aes128-cbc,aes256-cbc,3des-cbc'

  tasks:
    - name: Create VLAN 70 and save config
      ios_command:
        commands:
          - configure terminal
          - vlan 70
          - name Data_Network
          - end
          - write memory
